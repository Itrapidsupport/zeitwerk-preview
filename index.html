    <link rel="preload" href="%BASE_URL%fonts/Inter-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Motion kit (lane 07): JS-on flag. Content is visible by default; only html.mk-js may pre-hide reveal
         targets. Failsafe: if the app never mounts within 4s the flag is removed and everything shows. -->
    <script>
      (function () {
        var d = document.documentElement
        var reduce = /[?&]reduce\b/.test(location.search) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
        if (!reduce) d.classList.add('mk-js')
        setTimeout(function () { if (!window.__mkReady) d.classList.remove('mk-js') }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
